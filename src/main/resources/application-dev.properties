# ============================================================
# Spring Boot Development Profile Configuration (dev)
# ============================================================
spring.application.name=StudentManagement-Dev
server.port=${PORT:8080}

# Local MSSQL DataSource Configuration
spring.datasource.url=${DEV_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=StudentDB;trustServerCertificate=true;}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DEV_DB_USERNAME:student_user}
spring.datasource.password=${DEV_DB_PASSWORD:Password@123}

# JPA / Hibernate Configuration for Dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
