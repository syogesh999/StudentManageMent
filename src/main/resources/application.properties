# ============================================================
# Spring Boot Application Configuration (Base / Production)
# ============================================================
spring.application.name=StudentManagement
server.port=${PORT:8080}

# ============================================================
# MSSQL DataSource Configuration
# Environment variables override defaults in deployment environments
# ============================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=StudentDB;trustServerCertificate=true;}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:student_user}
spring.datasource.password=${DB_PASSWORD:Password@123}

# ============================================================
# JPA / Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
