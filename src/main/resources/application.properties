# ============================================================
# Spring Boot Application Configuration (Base Template)
# ============================================================
spring.application.name=StudentManagement
server.port=${PORT:8080}

# ============================================================
# MSSQL DataSource Configuration
# Provide DB_URL, DB_USERNAME, and DB_PASSWORD via environment variables
# in production/deployment environments
# ============================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=StudentDB;trustServerCertificate=true;}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# ============================================================
# JPA / Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
