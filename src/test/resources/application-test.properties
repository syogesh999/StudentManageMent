# ============================================================
# Test Profile — H2 In-Memory Database
# Used by @ActiveProfiles("test") integration tests
# ============================================================
spring.application.name=StudentManagement-Test

# H2 In-Memory DataSource (auto-destroyed after each test class)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: auto-create schema from @Entity classes, then drop on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Use H2 dialect for SQL generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
